[package]
name = "iced_wgpu"
description = "A renderer for iced on top of wgpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
default = ["wgpu/default"]
geometry = ["iced_graphics/geometry", "lyon"]
image = ["iced_graphics/image"]
svg = ["iced_graphics/svg", "resvg/text"]
web-colors = ["iced_graphics/web-colors"]
webgl = ["wgpu/webgl"]
strict-assertions = []
x11 = [
    "dep:as-raw-xcb-connection",
    "dep:raw-window-handle",
    "dep:rustix",
    "dep:tiny-xlib",
    "dep:x11rb",
]
wayland = [
    "dep:raw-window-handle",
    "dep:rustix",
    "dep:smithay-client-toolkit",
    "dep:wayland-backend",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-sys",
]

[dependencies]
iced_debug.workspace = true
iced_graphics.workspace = true

bitflags.workspace = true
bytemuck.workspace = true
futures.workspace = true
glam.workspace = true
cryoglyph.workspace = true
guillotiere.workspace = true
log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
wgpu.workspace = true

lyon.workspace = true
lyon.optional = true

resvg.workspace = true
resvg.optional = true

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "redox")))'.dependencies]
raw-window-handle = { version = "0.6", optional = true }
rustix = { version = "0.38", features = ["fs"], optional = true }
smithay-client-toolkit = { version = "0.19", default-features = false, optional = true }
wayland-backend = { version = "0.3", features = ["client_system"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = [
    "client",
    "staging",
    "unstable",
], optional = true }
wayland-sys = { version = "0.31", features = ["client", "dlopen"], optional = true }
as-raw-xcb-connection = { version = "1.0", optional = true }
tiny-xlib = { version = "0.2", optional = true }
x11rb = { version = "0.13", features = [
    "allow-unsafe-code",
    "dl-libxcb",
    "dri3",
    "randr",
], optional = true }
