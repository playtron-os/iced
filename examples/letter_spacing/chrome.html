<!doctype html>
<!-- The CSS the example's scene mirrors (keep in sync with `CASES`), rendered by
     headless Chrome at a device scale factor of 2 into snapshots/chrome.png. -->
<html>
<head>
<style>
  @font-face { font-family: Geist; font-weight: 600; src: url("fonts/Geist-SemiBold.ttf"); }
  body { margin: 0; width: 240px; height: 100px; background: #000 }
  span { position: absolute; left: 10px; font: 600 14px/20px Geist; color: #fff; white-space: pre }
</style>
</head>
<body>
<span style="top: 10px">Settings office</span>
<span style="top: 40px; letter-spacing: -0.28px">Settings office</span>
<span style="top: 70px; letter-spacing: 0.5px">Settings office</span>
</body>
</html>
