<!doctype html>
<!-- The CSS the example's scene mirrors (keep in sync with `CASES`), rendered by
     headless Chrome at device scale factors of 1, 1.5 and 2 into snapshots/. -->
<html>
<body style="margin: 0; width: 380px; height: 180px; background: #101014">
<style>
  div { position: absolute; box-sizing: border-box; width: 100px; height: 60px; background: #202028; border: 0 solid #e8e8ee }
</style>
<div style="left: 20px; top: 20px; border-width: 0.5px"></div>
<div style="left: 140px; top: 20px; border-width: 0.25px"></div>
<div style="left: 260px; top: 20px; border-width: 1.5px"></div>
<div style="left: 20px; top: 100px; border-width: 0.5px; border-radius: 8px"></div>
<div style="left: 140px; top: 100px; border-bottom-width: 0.5px"></div>
<div style="left: 260px; top: 100px; border-width: 2.5px"></div>
</body>
</html>
