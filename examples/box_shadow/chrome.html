<!doctype html>
<!-- The CSS the example's scene mirrors (keep in sync with `CASES`), rendered by
     headless Chrome at a device scale factor of 2 into snapshots/chrome.png. -->
<html>
<body style="margin: 0; width: 720px; height: 400px; background: #f2f2f5">
<style>
  div { position: absolute; box-sizing: border-box; width: 140px; height: 90px; background: #fff }
</style>
<div style="left: 40px; top: 50px; border-radius: 12px; box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.5)"></div>
<div style="left: 210px; top: 50px; border-radius: 8px; background: linear-gradient(#ffffff, #dde6fb); box-shadow: 0 12px 28px -10px rgba(0, 0, 0, 0.6)"></div>
<div style="left: 380px; top: 50px; box-shadow: 0 0 0 12px rgba(20, 120, 255, 0.5)"></div>
<div style="left: 550px; top: 50px; border-radius: 4px; box-shadow: 0 0 16px 8px rgba(0, 0, 0, 0.4)"></div>
<div style="left: 40px; top: 250px; border-radius: 12px; background: rgba(255, 255, 255, 0.3); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6)"></div>
<div style="left: 210px; top: 250px; border-radius: 12px; border: 2px solid #8a8a96; box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5)"></div>
<div style="left: 380px; top: 250px; border-radius: 10px; box-shadow: inset 0 2px 0 #e03030"></div>
<div style="left: 550px; top: 250px; border-radius: 10px 30px 0 20px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45)"></div>
</body>
</html>
