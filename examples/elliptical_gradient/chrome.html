<!doctype html>
<!-- The CSS the example's scene mirrors (keep in sync with `CASES`), rendered by
     headless Chrome at a device scale factor of 2 into snapshots/chrome.png. -->
<html>
<body style="margin: 0; width: 640px; height: 300px; background: #101014">
<style>
  div { position: absolute }
</style>
<div style="left: 20px; top: 20px; width: 280px; height: 120px; background: radial-gradient(ellipse 140px 60px at 50% 50%, #4fd1ff, #101014)"></div>
<div style="left: 20px; top: 160px; width: 280px; height: 120px; background: radial-gradient(ellipse 84px 108px at 80% 20%, #ff7a3c, #7a3cff 50%, #101014)"></div>
<div style="left: 320px; top: 20px; width: 300px; height: 260px; background: radial-gradient(ellipse 225px 208px at 0% 100%, rgba(79, 209, 255, 0.42), rgba(79, 209, 255, 0) 85%), radial-gradient(ellipse 195px 182px at 100% 95%, rgba(157, 92, 255, 0.65), rgba(157, 92, 255, 0) 85%)"></div>
</body>
</html>
