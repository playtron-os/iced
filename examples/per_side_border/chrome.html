<!doctype html>
<!-- The CSS the example's scene mirrors (keep in sync with `CASES`), rendered by
     headless Chrome at a device scale factor of 2 into snapshots/chrome.png. -->
<html>
<body style="margin: 0; width: 520px; height: 200px; background: #101014">
<style>
  div { position: absolute; box-sizing: border-box; background: #202028; border: 0 solid #4fd1ff }
</style>
<div style="left: 20px; top: 20px; width: 160px; height: 48px; border-bottom-width: 1px"></div>
<div style="left: 20px; top: 88px; width: 160px; height: 92px; border-right-width: 1px"></div>
<div style="left: 200px; top: 20px; width: 140px; height: 72px; border-radius: 12px; border-width: 4px 0 1px 0"></div>
<div style="left: 200px; top: 108px; width: 140px; height: 72px; border-radius: 2px; border-width: 6px"></div>
<div style="left: 360px; top: 20px; width: 140px; height: 72px; border-radius: 16px; border-width: 2px 3px 6px 1px"></div>
<div style="left: 360px; top: 108px; width: 140px; height: 72px; border-left-width: 4px"></div>
</body>
</html>
